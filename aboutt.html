/* =========================================================
   VARIABLES
   ========================================================= */

let current = 0;

let answers = Array(questions.length).fill(null);


/* =========================================================
   DISPLAY QUESTION
   ========================================================= */

function render() {

    const q = questions[current];

    document.getElementById("app").innerHTML = `

        <div class="top">

            <strong>GES 103 CBT</strong>

            <span>
                Question ${current + 1} of ${questions.length}
            </span>

        </div>


        <div class="progress">

            <div
                class="bar"
                style="width:${((current + 1) / questions.length) * 100}%">
            </div>

        </div>


        <p class="small">
            Select one answer.
        </p>


        <h2>
            ${current + 1}. ${q[0]}
        </h2>


        ${q[1].map((option, index) => `

            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="${index}"

                    ${answers[current] === index ? "checked" : ""}

                    onchange="answers[current] = ${index}"
                >

                <b>${String.fromCharCode(65 + index)}.</b>

                ${option}

            </label>

        `).join("")}


        <div class="nav">

            <button
                onclick="prev()"
                ${current === 0 ? "disabled" : ""}>
                ← Previous
            </button>


            ${
                current === questions.length - 1

                ?

                `<button onclick="submitExam()">
                    Submit Exam
                </button>`

                :

                `<button onclick="next()">
                    Next →
                </button>`
            }

        </div>

    `;
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function next() {

    if (answers[current] === null) {

        alert("Please select an answer first.");

        return;
    }

    current++;

    render();
}


/* =========================================================
   PREVIOUS QUESTION
   ========================================================= */

function prev() {

    if (current > 0) {

        current--;

        render();
    }
}


/* =========================================================
   SUBMIT EXAM
   ========================================================= */

function submitExam() {

    if (answers[current] === null) {

        alert("Please select an answer first.");

        return;
    }


    let score = 0;


    answers.forEach((answer, index) => {

        if (answer === questions[index][2]) {

            score++;
        }

    });


    let percentage =
        (score / questions.length * 100).toFixed(1);


    /* CREATE ANSWER REVIEW */

    let review = questions.map((q, index) => {

        if (answers[index] === q[2]) {

            return `
                <p class="correct">
                    Q${index + 1} ✓ Correct
                </p>
            `;

        } else {

            return `
                <p class="wrong">

                    Q${index + 1} ✗

                    You chose:
                    ${
                        answers[index] === null
                        ? "Not answered"
                        : String.fromCharCode(65 + answers[index])
                    }

                    |

                    Correct answer:
                    ${String.fromCharCode(65 + q[2])}

                </p>
            `;
        }

    }).join("");


    /* DISPLAY RESULT */

    document.getElementById("app").innerHTML = `

        <div class="result">

            <h1>
                CBT Completed 🎉
            </h1>


            <div class="score">

                ${score}/60

            </div>


            <h2>

                ${percentage}%

            </h2>


            <p>

                Correct: ${score}

                &nbsp; | &nbsp;

                Wrong: ${60 - score}

            </p>


            <div class="review">

                <h2>
                    Answer Review
                </h2>

                ${review}

            </div>


            <button onclick="location.reload()">

                Take Again

            </button>

        </div>

    `;
}


/* =========================================================
   START CBT
   ========================================================= */

render();

</script>
