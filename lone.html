<html>
    <head>
        <body>
            

            <form action="">
                <fieldset>
                    <legend>Personal Information</legend>
                <label for="first">First Name</label><br>
                <input type="text" id="First" maxlength="20" minlength="5" placeholder="first name"><br><br> 
                <label for="last"> Last Name </label><br>
                <input type="text" id="last" maxlength="20" minlength="5" placeholder="last name" ><br><br>
                <label for="email"> Your Email </label><br>
                <input type="email" id="email" placeholder="Enter your email"><br><br>
                <label for="password">Password</label><br>
                <input type="password" id="password" placeholder="Enter your password"><br><br>
                <label for="phone"> Phone Number</label><br>
                <input type="number" id="Phone"><br><br>
                <label for="Gender"> Gender </label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="anonymous" name="I'd rather not say" value="anonymous">
                <label for="anonymous"> I'd rather not say </label><br><br>

                
                <label for="terms"> Do you agree to the terms and condition?</label><br>
                <input type="checkbox" id="terms"> 
                <label  >i agree to terms and condition </label><br><br>
                <label for="Job"> Choose your job </label><br>
                <input type="checkbox"  id="job" name="job" value="lawyer">
                <label for="job">Lawyer</label><br>
                <input type="checkbox" id="job" name="job" value="Doctor">
                <label for="job"> Doctor</label><br>
                <input type="checkbox" id="job" name="job" value="Engineer">
                <label for="job"> Engineer </label><br><br>

                <label for="date">  Choose your date of birth </label>
                <input type="date" id="date"><br><br>
                <label for="Time"> Choose your time </label>
                <input type="time" id="time"><br><br>
                <label for="file">Choose a file</label>
                <input type="file" name="file" id="file" multiple><br><br>

                <select name="Country" id="Country">
                    <option value="">Choose your Country</option>
                    <option value="Nigeria">Nigeria</option>
                    <option value="Ghana">Ghana</option>
                    <option value="United State Of America">United State Of America</option>
                    <option value="United Kingdon">United Kingdon</option>
                    <option value="South Africa">South Africa</option>
                    <option value="New Zealand">New Zealand</option>
                </select><br><br>

                <label for="comment"> Enter Your Comment </label><br>
                <textarea name="comment" id="comment" cols="100" rows="20"></textarea><br><br>

                <button type="submit">Submit</button>
                </fieldset>
            </form>


        </body>
    </head>
</html>
